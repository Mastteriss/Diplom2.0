<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22682a">
  <title>{{ page_title }} — ИС анализа качества продукции</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2322682a'/%3E%3Cpath%20d='M5%2021.5a11%2011%200%200%201%2022%200'%20fill='none'%20stroke='%2347c3bc'%20stroke-width='2.6'%20stroke-linecap='round'/%3E%3Cpath%20d='M16%2021.5l5.4-8.6'%20fill='none'%20stroke='%2391c347'%20stroke-width='2.6'%20stroke-linecap='round'/%3E%3Ccircle%20cx='16'%20cy='21.5'%20r='2.2'%20fill='%2391c347'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 34 34" width="32" height="32" aria-hidden="true" focusable="false">
      <path d="M5 24a12 12 0 0 1 24 0" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path class="mark-needle" d="M17 24l6-9.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <circle class="mark-hub" cx="17" cy="24" r="2.2" fill="currentColor"/>
      <path d="M5.5 27.5h23" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </svg>
    <a class="brand-title" href="/">ИС анализа качества продукции</a>
  </div>
  <nav class="main-nav" aria-label="Основное меню">
    {% for key, label, href in menu %}
    <a class="nav-btn{% if key == active %} nav-btn-active{% endif %}"
       href="{{ href }}"{% if key == active %} aria-current="page"{% endif %}>
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        {% if key == 'home' %}<path d="M3 11.2 12 4l9 7.2v8.3a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"/><path d="M9 21v-6h6v6"/>
        {% elif key == 'products' %}<path d="m4 7 8-4 8 4-8 4z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/>
        {% elif key == 'batches' %}<rect x="4" y="4" width="16" height="5" rx="1"/><rect x="4" y="10" width="16" height="5" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/>
        {% elif key == 'pareto' %}<path d="M5 19V9M12 19V5M19 19v-7"/><path d="M3 19h18"/>
        {% elif key == 'trends' %}<path d="M4 17 9 12l4 3 7-8"/><path d="M16 7h4v4"/>
        {% elif key == 'spc' %}<path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 4-6"/>
        {% else %}<path d="M12 3a2 2 0 0 1 2 2v.4a7.8 7.8 0 0 1 2.1.9l.3-.3a2 2 0 1 1 2.8 2.8l-.3.3c.4.7.7 1.4.9 2.1h.4a2 2 0 1 1 0 4h-.4a7.8 7.8 0 0 1-.9 2.1l.3.3a2 2 0 1 1-2.8 2.8l-.3-.3a7.8 7.8 0 0 1-2.1.9v.4a2 2 0 1 1-4 0v-.4a7.8 7.8 0 0 1-2.1-.9l-.3.3a2 2 0 1 1-2.8-2.8l.3-.3A7.8 7.8 0 0 1 5.2 15h-.4a2 2 0 1 1 0-4h.4a7.8 7.8 0 0 1 .9-2.1l-.3-.3a2 2 0 1 1 2.8-2.8l.3.3a7.8 7.8 0 0 1 2.1-.9V5a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="2.5"/>{% endif %}
      </svg>
      <span>{{ label }}</span>
    </a>
    {% endfor %}
  </nav>
</header>

<main class="content">
  <h1 class="page-title">{{ page_title }}</h1>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span class="footer-item">Версия {{ app_version }}</span>
    <span class="footer-item">Схема БД: <strong>v{{ schema_version }}</strong></span>
    <span class="footer-item">Веса индекса: <strong>v{% if weights_version is not none %}{{ weights_version }}{% else %}—{% endif %}</strong></span>
  </div>
</footer>
</body>
</html>
